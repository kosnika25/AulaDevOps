<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Sistema DevOps</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
    <nav>
        <div class="nav-container">
            <div class="logo">Sistema DevOps</div>
            <ul class="nav-links">
                <li><a href="/login">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-hero compact">
        <div class="auth-copy">
            <span class="eyebrow">🔐 Nova Senha</span>
            <h1>Crie uma senha segura</h1>
            <p>Digite e confirme sua nova senha para recuperar o acesso ao sistema.</p>
        </div>
    </section>

    <div class="container auth-container">
        <div class="form-container auth-card">
            <form th:action="@{/redefinir-senha}" method="post">
                <h2 class="form-title">Redefinir Senha</h2>
                <input type="hidden" name="token" th:value="${token}">

                <div class="alerta alerta-erro" th:if="${erro}">
                    <p th:text="${erro}"></p>
                </div>

                <div class="form-group">
                    <label for="senha">Nova Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required autofocus style="color: #F3F4F6 !important;">
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar Nova Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" minlength="6" required style="color: #F3F4F6 !important;">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">✅ Salvar Nova Senha</button>
                    <a href="/login" class="btn btn-secondary">← Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
